name: Build & Release (Windows & Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        shell: powershell

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
        shell: powershell

      - name: Build Windows Executable
        run: |
          wails build -clean -platform windows/amd64
        shell: powershell

      - name: Prepare Windows Distribution Binary
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/bin/gecko.exe dist/gecko-windows-amd64.exe
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-windows-amd64
          path: dist/gecko-windows-amd64.exe

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Build Linux Executable
        run: |
          wails build -clean -platform linux/amd64

      - name: Package Linux Distribution Files
        run: |
          mkdir -p dist
          chmod +x build/bin/gecko
          tar -czvf dist/gecko-linux-amd64.tar.gz -C build/bin gecko
          cp build/bin/gecko dist/gecko-linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-linux-amd64
          path: |
            dist/gecko-linux-amd64.tar.gz
            dist/gecko-linux-amd64

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: gecko-windows-amd64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: gecko-linux-amd64
          path: release-assets

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/gecko-windows-amd64.exe
            release-assets/gecko-linux-amd64.tar.gz
            release-assets/gecko-linux-amd64
          generate_release_notes: true
          draft: false
          prerelease: false
